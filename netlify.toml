[build]
  command = "npm run db:push:turso && npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NPM_FLAGS = "--include=dev"
  # URLs en mails de invitación / resets (sitio público sin barra final)
  APP_PUBLIC_URL = "https://playful-liger-bf4118.netlify.app"

# Expuesto también en tiempo de ejecución de Functions (invitaciones, SMTP links)
[context.production.environment]
  APP_PUBLIC_URL = "https://playful-liger-bf4118.netlify.app"

# Respaldo (A): más margen para POST pesados (p. ej. factura + recálculo de recetas).
# El tope efectivo depende del plan Netlify; si el deploy rechaza la clave, quitar o ajustar.
[functions]
  node_bundler = "esbuild"

[functions.api]
  timeout = 26

# Static SPA y API proxy (no copiar SPA catch-all a client/public/_redirects: puede mandar todo /api/* a index.html).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
